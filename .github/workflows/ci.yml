name: OpenDocFlow v4.0 CI & Syntax Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify All JavaScript & ESM Modules
        shell: pwsh
        run: |
          $jsFiles = @(
            'main.js',
            'preload.js',
            'mcp/opendocflow-mcp.mjs',
            'lib/docflow-engine.js',
            'lib/gateway-benchmark.js',
            'lib/agents-installer.js',
            'lib/providers-catalog.js',
            'lib/agent-runner.js',
            'app/renderer.js',
            'setup-kit/config/plugins/free-model-autoswitch.js'
          )
          foreach ($f in $jsFiles) {
            node --check $f
            if ($LASTEXITCODE -ne 0) { throw "Syntax error in $f" }
          }

      - name: Verify PowerShell Setup Scripts Syntax
        shell: pwsh
        run: |
          Get-ChildItem setup-kit/scripts -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { throw "Parse error in $($_.Name): $errors" }
          }

      - name: Privacy & Secret Guard
        shell: pwsh
        run: |
          $tracked = git ls-files | Where-Object { $_ -notmatch '\.(png|ico|zip)$' -and (Test-Path $_) }
          $leaks = $tracked | Select-String -Pattern 'sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|AIza[A-Za-z0-9_-]{25,}'
          if ($leaks) { throw "Potential secret detected in repository!" }
